<!DOCTYPE html>
<html lang="en" style="background:#FAF8FC;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme: light only; }
  *{box-sizing:border-box;}
  body{ margin:0; background:#FAF8FC; color:#241933; font-family:'Karla', Arial, sans-serif; }
  .wrap{max-width:400px; margin:0 auto; padding:56px 24px;}
  h1{font-family:'Fraunces', serif; font-size:1.6rem; color:#2E0854; margin-bottom:24px;}
  label{display:block; font-size:0.85rem; font-weight:700; margin-bottom:6px; margin-top:16px;}
  input{width:100%; padding:12px 14px; border:1.5px solid #E4D9F0; border-radius:10px; font-family:inherit; font-size:0.98rem;}
  input:focus{outline:none; border-color:#7C2AE8;}
  button{width:100%; margin-top:26px; padding:14px; border:none; border-radius:100px; background:#7C2AE8; color:white; font-weight:700; font-size:1rem; cursor:pointer;}
  button:disabled{opacity:0.5;}
  .error{color:#C2367B; font-size:0.88rem; margin-top:14px; text-align:center;}
  .signup-link{text-align:center; margin-top:18px; font-size:0.88rem; color:#5B4E6D;}
  .signup-link a{color:#7C2AE8; font-weight:700; text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Log in</h1>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <button type="submit" id="submitBtn">Log in</button>
    <p class="error" id="errorMsg" hidden></p>
  </form>
  <p class="signup-link">Don't have an account? <a href="signup.html">Create one</a></p>
</div>

<script>
  var API_BASE = window.location.origin;

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var errorEl = document.getElementById('errorMsg');
    var btn = document.getElementById('submitBtn');
    errorEl.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    })
    .then(function(r){
      if(!r.ok){ return r.json().then(function(d){ throw new Error(d.detail || 'Could not log in.'); }); }
      return r.json();
    })
    .then(function(data){
      localStorage.setItem('whc_token', data.access_token);
      window.location.href = 'account.html';
    })
    .catch(function(err){
      errorEl.textContent = err.message;
      errorEl.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Log in';
    });
  });
</script>
</body>
</html>
